<body data-page="account">
<header id="site-header"></header>
<main>
<section class="section pt-2">
  <div class="container" data-account hidden>
    <div class="row between items-end mb-2">
      <div><div class="eyebrow">Your account</div><h1 class="m-0">Hi, <span class="grad-text" data-user-name></span></h1><p class="muted m-0"><span data-user-email></span> &middot; member since <span data-member-since></span></p></div>
      <button class="btn btn-secondary" data-logout>Sign out</button>
    </div>
    <div class="account-grid">
      <div class="card full">
        <h2>Orders</h2>
        <div class="stack gap-sm" data-orders><p class="muted">Loading…</p></div>
      </div>
      <div class="card full">
        <h2>Saved blends</h2>
        <div class="stack" data-blends><p class="muted">Loading…</p></div>
      </div>
      <div class="card">
        <h2>Profile</h2>
        <form class="form-grid" data-profile-form novalidate>
          <div class="form-error full" data-error hidden></div>
          <div class="field full"><label for="a-name">Name</label><input class="input" id="a-name" name="name" maxlength="80" autocomplete="name"></div>
          <div class="field full"><label for="a-email">Email</label><input class="input" id="a-email" name="email" type="email" required autocomplete="email"></div>
          <div class="field full"><label for="a-pw-confirm">Current password <span class="muted">(only needed to change the email)</span></label><input class="input" id="a-pw-confirm" name="password" type="password" autocomplete="current-password"></div>
          <div class="full"><button class="btn btn-primary" type="submit">Save changes</button></div>
        </form>
      </div>
      <div class="card">
        <h2>Password</h2>
        <form class="form-grid" data-password-form novalidate>
          <div class="form-error full" data-error hidden></div>
          <div class="field full"><label for="a-current">Current password</label><input class="input" id="a-current" name="current" type="password" required autocomplete="current-password"></div>
          <div class="field full"><label for="a-next">New password</label><input class="input" id="a-next" name="next" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div>
          <div class="field full"><label for="a-confirm">Confirm new password</label><input class="input" id="a-confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password"></div>
          <div class="full row between"><button class="btn btn-primary" type="submit">Change password</button><button class="btn btn-ghost" type="button" data-logout-all>Sign out everywhere</button></div>
        </form>
      </div>
      <div class="card danger full">
        <h2>Delete account</h2>
        <p class="muted">Removes your profile and saved blends permanently. The cart in this browser is not affected.</p>
        <form class="form-grid" data-delete-form novalidate>
          <div class="form-error full" data-error hidden></div>
          <div class="field"><label for="a-del-pw">Password</label><input class="input" id="a-del-pw" name="password" type="password" required autocomplete="current-password"></div>
          <div class="field end"><button class="btn btn-danger" type="submit">Delete my account</button></div>
        </form>
      </div>
    </div>
  </div>
</section>
</main>
